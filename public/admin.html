<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • Phở Đại Chiến V7.2</title><link rel="stylesheet" href="/theme.css?v=7.2.0"></head>
<body><div class="shell"><header class="header"><div class="logo">🍜 PHỞ <b>ĐẠI CHIẾN V7.2</b></div><span class="mini-tag">BẢNG ĐIỀU KHIỂN / ADMIN</span></header><main id="app"></main><div id="bottom"></div></div>
<script src="/socket.io/socket.io.js"></script><script src="/shared.js?v=7.2.0"></script>
<script>
'use strict';
const app=document.getElementById('app'),socket=io();
const KEY='pho_v71_admin';let code='',token='',state=null,connected=false,busy=false;
function save(){sessionStorage.setItem(KEY,JSON.stringify({code,token}));}
function clear(){code='';token='';state=null;sessionStorage.removeItem(KEY);}
function call(event,params={}){
 if(!socket.connected){toast('Đang mất kết nối. Chờ vài giây rồi thử lại.');return;}
 if(busy)return;
 busy=true;document.querySelectorAll('[data-action]').forEach(b=>b.disabled=true);
 socket.timeout(12000).emit(event,{code,token,...params},(err,res)=>{
   busy=false;
   if(err){toast('Không nhận được trả lời từ máy chủ. Hãy kiểm tra kết nối rồi thử lại.');render();return;}
   if(!res?.ok){toast(res?.error||'Yêu cầu không thực hiện được.');render();return;}
   if(event==='host:create'){
     code=res.code;token=res.token;save();
     toast('Đã tạo phòng '+code+' · Gửi link người chơi cho lớp.');
   }
   if(event==='host:close')toast(res.already?'Vòng đã có kết quả.':'Đã chốt phiếu và công bố kết quả!');
   if(event==='host:open')toast('Vòng '+(res.round+1)+' đã mở bỏ phiếu.');
   render();
 });
}
function create(){call('host:create');}
function act(which){if(!code||!token){toast('Bạn cần tạo phòng trước.');return;}
 if(which==='host:reset'&&!confirm('Chơi lại từ vòng 1? Toàn bộ kết quả và phiếu cũ sẽ được xóa.'))return;
 const seconds=Number(document.getElementById('seconds')?.value)||35;
 call(which,which==='host:open'?{seconds}:{});
}
function copyLink(){const link=location.origin+'/play?room='+code;
 if(navigator.clipboard?.writeText)navigator.clipboard.writeText(link).then(()=>toast('Đã sao chép đường dẫn người chơi.')).catch(()=>prompt('Sao chép liên kết:',link));else prompt('Sao chép liên kết:',link);
}
function ui(){if(!code)return `<section class="hero"><p class="eyebrow">QUẢN TRỊ CHUỖI GIÁ TRỊ · MÔ PHỎNG DOANH NGHIỆP</p><h1>HAI QUÁN PHỞ.<br><em>MỘT NGÔI VÔ ĐỊCH.</em></h1><p>Hai phe ra quyết định. Biến cố thị trường xuất hiện. Lợi nhuận sẽ quyết định người thắng.</p><div class="toolbar" style="justify-content:center;margin-top:28px"><button class="btn primary" data-action="create">＋ TẠO PHÒNG MỚI</button></div><p class="muted">Máy tính Admin chiếu trên ClassIn · Sinh viên truy cập link /play bằng điện thoại.</p></section>`;
 if(!state)return `<div class="panel"><h2>Đang đồng bộ phòng ${e(code)}...</h2><p class="muted">Đảm bảo Render đang chạy bản V7.2 tại /health.</p><button class="btn" data-action="resume">Thử kết nối lại phòng</button> <button class="btn ghost" data-action="newroom">Tạo phòng khác</button></div>`;
 const st=state.status;let top=`<div class="title-divider"><div><p class="eyebrow">PHÒNG ĐANG HOẠT ĐỘNG · ${e(st.toUpperCase())}</p><h1 class="big-code">${e(code)}</h1><p class="copy-link">Link sinh viên: ${e(location.origin+'/play?room='+code)}</p></div><div class="flex"><button class="btn" data-action="copy">🔗 Sao chép link chơi</button><span class="chip ${connected?'status-good':'status-bad'}">${connected?'● ĐÃ KẾT NỐI':'● MẤT KẾT NỐI'}</span></div></div><div class="section grid2">${state.teams.map(finCard).join('')}</div>`;
 if(st==='lobby')return top+`<section class="section panel soft"><p class="eyebrow">CHỜ NGƯỜI CHƠI THAM GIA</p><h2 class="section-title">Hai quán đã sẵn sàng</h2><p class="muted">Mỗi sinh viên chọn 1 phe. Khi lớp đã vào phòng, nhấn mở vòng 1.</p><div class="toolbar"><label>Thời gian/vòng <select id="seconds" class="input" style="width:100px;display:inline-block"><option value="20">20s</option><option value="35" selected>35s</option><option value="50">50s</option><option value="60">60s</option></select></label><button class="btn primary" data-action="host:open">▶ BẮT ĐẦU VÒNG 1</button><button class="btn ghost" data-action="host:reset">↺ ĐẶT LẠI</button></div></section>`;
 if(st==='voting')return top+`<section class="section"><div class="title-divider"><div><p class="eyebrow">VÒNG ${state.round+1} / ${state.totalRounds} · ĐANG BỎ PHIẾU</p><h2 class="section-title">${e(state.title)}</h2><p class="subtle">${e(state.story)}</p></div><div class="timer" id="clock">⏱ ${Fmt.ticker(state.deadline)}</div></div><div class="grid2">${questionCard(state.scenario,'A',state.teams[0].votes)}${questionCard(state.scenario,'B',state.teams[1].votes)}</div><div class="toolbar"><button class="btn primary" data-action="host:close">■ CHỐT PHIẾU & CÔNG BỐ KẾT QUẢ NGAY</button><span class="muted">Hết giờ: máy chủ tự công bố, kể cả không ai bỏ phiếu.</span></div></section>`;
 if(st==='results')return `<div class="title-divider result-header"><div><p class="eyebrow">PHÒNG ${e(code)} · VÒNG ${state.round+1}/${state.totalRounds}</p><h2 class="section-title">🎲 CÔNG BỐ KẾT QUẢ</h2>${roundVerdict(state)}</div><button class="btn primary" data-action="${state.round===state.totalRounds-1?'host:finish':'host:open'}">${state.round===state.totalRounds-1?'🏆 CÔNG BỐ QUÁN THẮNG':'▶ MỞ VÒNG '+(state.round+2)}</button></div>${resultMiniScoreboard(state)}<section class="section result-stage">${resultsPair(state,null,false)}${hintAboutSales(state)}<div class="toolbar"><button class="btn ghost" data-action="host:reset">↺ CHƠI LẠI</button></div></section>`;
 if(st==='finished')return top+`<section class="section">${endView(state)}<div class="toolbar"><button class="btn primary" data-action="host:reset">↺ CHƠI LẠI CÙNG HAI PHE</button></div></section>`;
 return top;
}
function render(){app.innerHTML=ui()+bottomNote();}
function reconnect(){if(!code||!token)return;
 socket.timeout(10000).emit('host:resume',{code,token},(err,res)=>{
  if(err||!res?.ok){const old=code;clear();render();toast(`Không còn phòng ${old} trên máy chủ. Hãy tạo phòng mới.`);return;}
  render();
 });
}
socket.on('connect',()=>{connected=true;reconnect();render()});
socket.on('disconnect',()=>{connected=false;render();toast('Mất kết nối Render. Game sẽ tự kết nối lại.');});
socket.on('state',s=>{if(s.code!==code)return;state=s;render();});
socket.on('game:error',msg=>toast(msg));
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;if(action==='create')create();else if(action==='copy')copyLink();else if(action==='resume')reconnect();else if(action==='newroom'){clear();render();}else act(action);});
setInterval(()=>{const c=document.getElementById('clock');if(c&&state?.status==='voting'){const secs=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));c.textContent='⏱ '+secs+'s';c.classList.toggle('urgent',secs<=10)}},250);
try{const x=JSON.parse(sessionStorage.getItem(KEY)||'null');if(x?.code&&x?.token){code=x.code;token=x.token}}catch{}
render();
</script></body></html>
