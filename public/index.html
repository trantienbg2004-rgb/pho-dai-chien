<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHỞ ĐẠI CHIẾN | Game quản trị chuỗi giá trị</title><style>
:root{--bg:#0b1426;--panel:#15233a;--panel2:#1e304c;--txt:#ecf4ff;--muted:#a5bad3;--gold:#ffc857;--a:#49b9fb;--b:#ff8b6c;--good:#64e5ac;--bad:#fa7985}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#20385d 0,transparent 35%),var(--bg);font:16px system-ui,-apple-system,Segoe UI,sans-serif;color:var(--txt)}button,input{font:inherit}button{border:0;border-radius:13px;background:var(--gold);padding:13px 18px;color:#201b12;font-weight:800;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#29415d;color:white}.link{background:transparent;color:var(--a);padding:4px}.wrap{max-width:1200px;margin:auto;padding:28px 18px 60px}.center{text-align:center}.eyebrow{text-transform:uppercase;letter-spacing:.25em;color:var(--gold);font-weight:750;font-size:12px}h1{font-size:clamp(38px,5.8vw,74px);letter-spacing:-.06em;margin:8px 0}h2{font-size:clamp(22px,3vw,34px);margin:6px 0 18px}h3{margin:2px 0 14px}p{color:var(--muted);line-height:1.65}.hero{padding:50px 0 24px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.panel{background:linear-gradient(155deg,var(--panel),#101d33);border:1px solid #354b6b;border-radius:22px;padding:24px}.teamA{border-top:5px solid var(--a)}.teamB{border-top:5px solid var(--b)}.teamname{font-size:27px;font-weight:900}.big{font-size:clamp(28px,4vw,52px);font-weight:900;letter-spacing:-.04em;margin:4px 0}.sub{color:var(--muted);font-size:13px}.pill{padding:6px 11px;border-radius:99px;background:var(--panel2);font-size:13px;font-weight:800;display:inline-block}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{background:#21344f;padding:12px;border-radius:13px}.metric b{display:block;font-size:19px;margin-top:5px}.row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:12px}.scenario{border:1px solid #6f5834;background:linear-gradient(100deg,#49301d,#2c2634);border-radius:20px;padding:22px;margin:20px 0}.scenario p{color:#f6dec2;margin-bottom:8px}.options{display:grid;gap:10px}.opt{display:block;text-align:left;width:100%;background:#243c5b;color:white;border:2px solid transparent;padding:16px;line-height:1.5}.opt.selected{border-color:var(--gold);background:#3c4961}.notice{background:#203b35;color:#bef8d2;border-radius:12px;padding:12px 16px}.warning{background:#4b3134;color:#ffd9dd;border-radius:12px;padding:12px 16px}.separator{height:1px;background:#38516f;margin:15px 0}.input{width:100%;border:1px solid #486181;background:#0f1f35;border-radius:12px;padding:15px;color:white}.label{display:block;margin:15px 0 6px;color:#c7d7e9;font-weight:700}.space{height:18px}.roundCount{color:var(--gold);font-weight:800}.bar{background:#2e445b;height:10px;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--good);transition:width .5s}.result{font-size:clamp(16px,2vw,24px);font-weight:800}.hidden{display:none!important}.tagA{color:var(--a)}.tagB{color:var(--b)}.qrnote{color:#c3d5e9;font-size:14px}.leader{font-size:clamp(26px,4vw,49px);font-weight:900;color:var(--gold)}.voteCount{font-size:13px;color:var(--muted)}.finrow{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #304764}.footer{margin-top:25px;color:#7f9ab8;font-size:12px}.timer{color:var(--gold);font-weight:900;font-size:36px}.copy{font-size:14px}.tiny{font-size:12px;color:#adc1d6}.winner{background:linear-gradient(90deg,#7d4b17,#3c2c24);border:1px solid #bc8e36;padding:30px;border-radius:25px}.teamChoice{width:100%;font-size:24px;margin:7px 0}.buttonrow{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.buttonrow button{flex:1}@media(max-width:700px){.grid{grid-template-columns:1fr}.panel{padding:18px}.wrap{padding-top:14px}.hero{padding-top:28px}.metrics{gap:7px}.metric{padding:9px}}@media(min-width:900px){body.hostView .wrap{max-width:1450px}}
</style></head><body><div class="wrap" id="app"></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io();const app=document.getElementById('app');const money=n=>Math.round(n).toLocaleString('vi-VN')+'đ';const millions=n=>(n/1000000).toLocaleString('vi-VN',{maximumFractionDigits:2})+' triệu';let state=null,role=null,myId=localStorage.getItem('phoPlayerId')||'',myTeam=localStorage.getItem('phoTeam')||'',voted=false,selected=null,hostSecret='',code='';let lastRound=-1;const params=new URLSearchParams(location.search);const roomFromUrl=(params.get('room')||'').toUpperCase();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function send(event,arg,callback){socket.emit(event,arg,callback||function(){})}
function copyUrl(){navigator.clipboard?.writeText(location.origin+'/?room='+code).then(()=>alert('Đã sao chép link tham gia')).catch(()=>prompt('Sao chép link:',location.origin+'/?room='+code))}
function startHost(){send('host:create',{},res=>{if(!res.ok)return;role='host';code=res.code;hostSecret=res.secret;sessionStorage.setItem('phoHost',JSON.stringify({code,secret:hostSecret}));document.body.classList.add('hostView');render()})}
function resumeHost(o){send('host:resume',o,res=>{if(res.ok){role='host';code=o.code;hostSecret=o.secret;document.body.classList.add('hostView');render()}})}
function join(){const name=document.getElementById('name').value.trim();const team=document.querySelector('input[name=team]:checked')?.value;const c=document.getElementById('roomCode').value.trim().toUpperCase();if(!name||!team||!c){alert('Hãy nhập tên, mã phòng và chọn phe');return}send('player:join',{code:c,name,team,playerId:myId},res=>{if(!res.ok)return alert(res.error);myId=res.playerId;myTeam=team;role='player';code=c;localStorage.setItem('phoPlayerId',myId);localStorage.setItem('phoTeam',team);localStorage.setItem('phoName',name);localStorage.setItem('phoCode',c);render()})}
function cast(i){if(voted)return;selected=i;send('player:vote',{choice:i},res=>{if(res.ok){voted=true;render()}else alert(res.error)})}
function hostAct(event){send(event,{})}
function home(){app.innerHTML=`<div class="hero center"><div class="eyebrow">Mô phỏng quản trị chuỗi giá trị</div><h1>🍜 PHỞ ĐẠI CHIẾN</h1><p>2 quán phở. 4 biến cố. Mỗi thành viên một lá phiếu.<br>Ai kiếm được nhiều lợi nhuận hơn?</p></div><div class="grid"><div class="panel"><h2>🎮 Điều hành trò chơi</h2><p>Dành cho người thuyết trình, chia sẻ màn hình này lên ClassIn.</p><button onclick="startHost()">Tạo phòng mới</button></div><div class="panel"><h2>🙋 Tham gia thi đấu</h2><label class="label">Mã phòng</label><input class="input" id="roomCode" placeholder="Ví dụ: A1B2C3" value="${esc(roomFromUrl)}" maxlength="6"><label class="label">Tên hiển thị</label><input class="input" id="name" placeholder="Tên của bạn" value="${esc(localStorage.getItem('phoName')||'')}"><label class="label">Chọn đội</label><label><input type="radio" name="team" value="A"> 🔵 Quán phở A</label><br><br><label><input type="radio" name="team" value="B"> 🔴 Quán phở B</label><div class="space"></div><button onclick="join()">Vào đội và nhận quyền bỏ phiếu</button></div></div>`}
function metrics(f){return `<div class="metrics"><div class="metric"><span class="sub">💰 Lợi nhuận tích lũy</span><b style="color:${f.cash>=0?'var(--good)':'var(--bad)'}">${millions(f.cash)}</b></div><div class="metric"><span class="sub">🍽️ Số bát tháng gần nhất</span><b>${f.customers.toLocaleString('vi-VN')}</b></div><div class="metric"><span class="sub">🏷️ Giá bán</span><b>${money(f.price)}</b></div><div class="metric"><span class="sub">🙂 Hài lòng</span><b>${f.satisfaction}%</b><div class="bar"><div class="fill" style="width:${f.satisfaction}%"></div></div></div></div>`}
function teamCard(t){return `<div class="panel team${t.id}"><div class="row"><div><div class="teamname ${t.id==='A'?'tagA':'tagB'}">QUÁN PHỞ ${t.id}</div><span class="sub">${t.players} thành viên · ${t.votes} phiếu đã gửi</span></div><span class="pill">Đội ${t.id}</span></div><div class="space"></div>${metrics(t.finance)}</div>`}
function resultSummary(s){if(!s?.last)return '';return `<h2 class="center">📊 Báo cáo tài chính vòng ${s.round+1}</h2><div class="grid">${s.teams.map(t=>{const d=s.last[t.id];return `<div class="panel team${t.id}"><h3>Quán phở ${t.id}</h3><div class="result">${d.profit>=0?'+':''}${millions(d.profit)}</div><span class="sub">Lợi nhuận riêng vòng này</span><div class="separator"></div><div class="finrow"><span>Quyết định được chọn</span><b>#${d.choice+1}${d.defaulted?' (mặc định)':''}</b></div><p>${esc(d.note)}</p><div class="finrow"><span>Phiếu (1 / 2 / 3)</span><b>${d.tally.join(' / ')}</b></div><div class="finrow"><span>Số bát bán</span><b>${d.sold}</b></div><div class="finrow"><span>Doanh thu</span><b>${money(d.revenue)}</b></div><div class="finrow"><span>Chi phí biến đổi</span><b>${money(d.variableCost)}</b></div><div class="finrow"><span>Chi phí cố định</span><b>${money(d.fixedCost)}</b></div><div class="finrow"><span>Chi phí/thu nhập phát sinh</span><b>${money(d.oneoff)}</b></div><div class="finrow"><span>Lợi nhuận tích lũy</span><b>${money(d.cumulative)}</b></div></div>`}).join('')}</div><p class="center">Kết nối kiến thức: nhà quản trị không chỉ cắt chi phí mà phải cân bằng giá trị cho khách hàng, doanh số và lợi nhuận.</p>`}
function showHost(){if(!state){app.innerHTML='<h2>Đang kết nối…</h2>';return}const s=state;let title=s.status==='lobby'?'Sẵn sàng vào cuộc!':s.status==='finished'?'🏆 CHUNG CUỘC':`VÒNG ${s.round+1}/${s.totalRounds}`;let content=`<div class="row"><div><div class="eyebrow">Bảng điều hành · Host</div><h1 style="font-size:40px">🍜 PHỞ ĐẠI CHIẾN</h1></div><div class="center"><span class="sub">MÃ PHÒNG</span><div class="big" style="color:var(--gold)">${code}</div><button class="secondary copy" onclick="copyUrl()">📋 Sao chép link tham gia</button></div></div><p class="qrnote">Người chơi mở <b>${esc(location.origin)}/?room=${code}</b> và chọn phe. Host chia sẻ màn hình này trên ClassIn.</p><div class="row"><span class="pill">${title}</span>${s.status==='voting'?`<div class="timer">⏱ ${s.timeLeft??35}s</div>`:''}</div><div class="space"></div><div class="grid">${s.teams.map(teamCard).join('')}</div>`;
if(s.status==='lobby')content+=`<div class="panel center" style="margin-top:18px"><h2>Chờ các đội gia nhập</h2><p>Chia lớp làm hai đội; từng sinh viên mở link và chọn đội. Mỗi người một phiếu ở mỗi vòng.</p><button onclick="hostAct('host:open')">BẮT ĐẦU VÒNG 1 →</button></div>`;
if(s.status==='voting'){const sc=s.scenario;content+=`<div class="scenario"><span class="roundCount">⚡ BIẾN CỐ ${s.round+1}</span><h2>${esc(sc.title)}</h2><p>${esc(sc.story)}</p><h3>${esc(sc.question)}</h3>${sc.options.map((o,i)=>`<div class="panel" style="padding:12px;margin:8px 0">${i+1}. ${esc(o.text)}</div>`).join('')}</div><div class="center"><p>Hai đội đang bỏ phiếu. Hệ thống lấy phương án nhiều phiếu nhất riêng cho từng đội. Nếu hòa, chọn phương án có số thứ tự nhỏ nhất; đội không bỏ phiếu dùng phương án 2.</p><button class="secondary" onclick="hostAct('host:close')">Đóng bình chọn & xem kết quả ngay</button></div>`}
if(s.status==='results'){content+=`<div class="space"></div>${resultSummary(s)}<div class="buttonrow">${s.round<s.totalRounds-1?`<button onclick="hostAct('host:open')">➡️ MỞ VÒNG ${s.round+2}</button>`:`<button onclick="hostAct('host:finish')">🏆 CÔNG BỐ ĐỘI THẮNG</button>`}<button class="secondary" onclick="hostAct('host:finish')">Kết thúc sớm</button></div>`}
if(s.status==='finished'){const a=s.teams[0].finance.cash,b=s.teams[1].finance.cash;const winner=a===b?'HAI QUÁN HÒA NHAU':a>b?'QUÁN PHỞ A':'QUÁN PHỞ B';content+=`<div class="winner center" style="margin-top:24px"><div class="eyebrow">Kết quả chung cuộc</div><div class="leader">🏆 ${winner}</div><h2>${a===b?'Hòa điểm!':`Thắng cách biệt ${millions(Math.abs(a-b))}`}</h2><div class="grid"><div class="panel"><b>QUÁN A</b><div class="big">${millions(a)}</div></div><div class="panel"><b>QUÁN B</b><div class="big">${millions(b)}</div></div></div><p>Thông điệp: Chi phí thấp chưa đủ; doanh nghiệp cần quản trị toàn chuỗi giá trị, giữ chất lượng và thu hút khách để tạo lợi nhuận bền vững.</p></div><div class="center buttonrow"><button class="secondary" onclick="hostAct('host:reset')">Chơi lại từ đầu (giữ đội)</button></div>`}
content+=`<div class="footer">Game mô phỏng giáo dục: số liệu và tác động quyết định là giả định, không phải dữ liệu thị trường. Mỗi vòng = một tháng; chi phí cố định 30 triệu đồng/tháng. Lợi nhuận = doanh thu − chi phí biến đổi − 30 triệu + thu/chi sự kiện.</div>`;app.innerHTML=content;}
function showPlayer(){if(!state){app.innerHTML='<h2>Đang kết nối…</h2>';return}let s=state;let team=s.teams.find(t=>t.id===myTeam);let content=`<div class="center"><div class="eyebrow">Người chơi · Phe ${myTeam}</div><h1 style="font-size:41px">🍜 QUÁN PHỞ ${myTeam}</h1><p>Phòng ${code} · ${team?.players||0} người trong phe</p></div>`;
if(s.status==='lobby')content+=`<div class="panel center"><h2>✅ Đã gia nhập phe ${myTeam}</h2><p>Chờ người điều hành bắt đầu. Mỗi vòng bạn được bỏ đúng một phiếu, không cần bật mic.</p></div>`;
if(s.status==='voting'){const sc=s.scenario;content+=`<div class="scenario"><div class="row"><span class="roundCount">Vòng ${s.round+1}/${s.totalRounds}</span><span class="timer">${s.timeLeft??35}s</span></div><h2>${esc(sc.title)}</h2><p>${esc(sc.story)}</p><h3>${esc(sc.question)}</h3></div><div class="options">${sc.options.map((o,i)=>`<button class="opt ${selected===i?'selected':''}" ${voted?'disabled':''} onclick="cast(${i})"><b>${i+1}.</b> ${esc(o.text)}</button>`).join('')}</div><div class="space"></div>${voted?'<div class="notice">✅ Phiếu của bạn đã được ghi nhận. Chờ kết quả đội.</div>':'<p>Chạm vào một phương án để bỏ phiếu. Không thể thay đổi sau khi gửi.</p>'}`}
if(s.status==='results')content+=`<div class="panel"><h2>📣 Kết quả đội ${myTeam}</h2><div class="big">${millions(s.last[myTeam].profit)}</div><p>${esc(s.last[myTeam].note)}</p><div class="finrow"><span>Quyết định thắng phiếu</span><b>${s.last[myTeam].choice+1}</b></div><div class="finrow"><span>Số phiếu (1 / 2 / 3)</span><b>${s.last[myTeam].tally.join(' / ')}</b></div><div class="finrow"><span>Lãi tích lũy</span><b>${millions(team.finance.cash)}</b></div></div><p class="center">Chờ host mở vòng tiếp theo.</p>`;
if(s.status==='finished'){const a=s.teams[0].finance.cash,b=s.teams[1].finance.cash;content+=`<div class="winner center"><h2>🏆 CHUNG CUỘC</h2><div class="leader">${a===b?'HÒA':(a>b?'QUÁN A':'QUÁN B')+' THẮNG'}</div><p>A: ${millions(a)} · B: ${millions(b)}</p><h2>${a===b?'Cả hai phe rất ngang tài!':(a>b?'A':'B')===myTeam?'🎉 Phe bạn chiến thắng!':'Hẹn phục thù lần sau!'}</h2></div>`}
app.innerHTML=content;}
function render(){if(role==='host')showHost();else if(role==='player')showPlayer();else home()}
socket.on('state',s=>{if(role===null){state=s;return}if(state&&s.round!==state.round){voted=false;selected=null}if(state?.status==='lobby'&&s.status==='voting'){voted=false;selected=null}state=s;render()});socket.on('connect',()=>{if(role==='host'&&code&&hostSecret)resumeHost({code,secret:hostSecret});else if(role==='player'&&code&&myTeam){send('player:join',{code,name:localStorage.getItem('phoName'),team:myTeam,playerId:myId},res=>{if(res.ok){myId=res.playerId;render()}})}});
const savedHost=sessionStorage.getItem('phoHost');if(savedHost){try{resumeHost(JSON.parse(savedHost))}catch(e){home()}}else if(roomFromUrl&&localStorage.getItem('phoCode')===roomFromUrl&&myId&&myTeam){role='player';code=roomFromUrl;send('player:join',{code,name:localStorage.getItem('phoName'),team:myTeam,playerId:myId},res=>{if(!res.ok){role=null;home()}else render()})}else home();setInterval(()=>{if(state?.status==='voting'&&state.deadline){const left=Math.max(0,Math.ceil((state.deadline-Date.now())/1000));document.querySelectorAll('.timer').forEach(e=>e.textContent='⏱ '+left+'s')}},500);
</script></body></html>
