<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Phở Đại Chiến V6 · Người chơi</title><style>
:root{--bg:#070d19;--card:#122238;--card2:#182d46;--border:#29435f;--txt:#f5f9ff;--muted:#a0b4cb;--gold:#ffcd77;--blue:#53bcff;--red:#ff8878;--green:#73e6ad}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 5%,#213b57,transparent 43%),linear-gradient(145deg,#080e1b,#0d1828);color:var(--txt);font:16px system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh}button,input{font:inherit}button{padding:13px 19px;border-radius:12px;border:0;cursor:pointer;background:var(--gold);color:#291b09;font-weight:800}button:disabled{opacity:.42;cursor:not-allowed}button.ghost{background:#25405e;color:white;border:1px solid #41617c}button:focus-visible,input:focus-visible{outline:3px solid var(--gold)}.shell{max-width:1440px;margin:auto;padding:24px 24px 55px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.brand{font-size:23px;letter-spacing:-.04em;font-weight:950}.brand span{color:var(--gold)}.muted{color:var(--muted)}.tiny{font-size:12px}.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.2em;font-weight:900;font-size:11px}h1{font-size:clamp(33px,5vw,64px);letter-spacing:-.055em;margin:10px 0}h2{font-size:clamp(21px,2.8vw,31px);margin:6px 0 12px}h3{margin:0 0 10px}p{line-height:1.55;color:var(--muted)}.center{text-align:center}.card{background:linear-gradient(155deg,rgba(30,49,73,.96),rgba(14,27,45,.98));border:1px solid var(--border);border-radius:22px;padding:24px}.gold{color:var(--gold)}.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}.tag{border-radius:50px;background:#243c55;padding:7px 11px;font-size:12px;font-weight:800;display:inline-block}.teamA{border-top:4px solid var(--blue)}.teamB{border-top:4px solid var(--red)}.subheader{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.money{font-size:clamp(26px,3vw,43px);font-weight:950;letter-spacing:-.05em}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:14px}.metric{border:1px solid #31465d;background:#11253e;border-radius:13px;padding:13px}.metric strong{font-size:20px;display:block;margin-top:3px}.line{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #30435a}.hero{padding:46px 0 20px}.hero p{max-width:650px}.strip{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0}.code{font-size:38px;font-weight:950;letter-spacing:.15em;color:var(--gold)}.event{padding:20px;background:linear-gradient(115deg,#49301e,#241c2d);border:1px solid #957143;border-radius:18px;margin:16px 0}.choices{display:grid;gap:10px}.choice{border:1px solid #385675;background:#1b3651;border-radius:13px;padding:13px 15px;line-height:1.5;color:white;text-align:left;width:100%;font-weight:600}.choice:hover:not(:disabled){border-color:var(--gold)}.choice.done{border-color:var(--green)}.pill{display:inline-block;border:1px solid #47617d;border-radius:50px;padding:7px 12px;font-size:13px}.timer{font-size:38px;font-weight:950;color:var(--gold)}.input{display:block;padding:15px;border-radius:12px;background:#0a182c;color:white;border:1px solid #4d6686;width:100%}.field{display:block;margin:13px 0 6px;color:#cfe0f0;font-size:13px;font-weight:750}.team-picker{display:grid;grid-template-columns:1fr 1fr;gap:10px}.team-picker label{padding:20px 10px;border:2px solid #37516e;border-radius:15px;text-align:center;cursor:pointer;font-weight:900}.team-picker label:has(input:checked){border-color:var(--gold);background:#273d51}.team-picker input{accent-color:var(--gold)}.notice{background:#203e38;border:1px solid #386f60;padding:16px;border-radius:13px;color:#c6ffde}.danger{background:#4e3037;border-color:#8b4551}.report{border:1px solid #405c77;background:#0f2337;border-radius:15px;padding:14px;margin-top:12px}.statusDot{display:inline-block;width:9px;height:9px;border-radius:100%;background:var(--green);margin-right:7px}.winner{padding:34px;text-align:center;border:1px solid #b18a42;border-radius:22px;background:radial-gradient(circle at 50% 20%,#574126,#1a2034 80%)}.progress{height:8px;background:#2c4259;border-radius:15px;overflow:hidden}.progress>div{height:100%;background:var(--green);transition:width .3s}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-top:19px}.empty{padding:50px 0;text-align:center}.footer{font-size:12px;color:#8fa7c0;margin-top:28px;line-height:1.6}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#3c2329;border:1px solid #b86b74;padding:14px;border-radius:10px;max-width:95%;z-index:10}.hide{display:none}@media(max-width:780px){.shell{padding:15px 13px 40px}.grid{grid-template-columns:1fr}.card{padding:18px}.metrics{gap:7px}.metric{padding:10px}.money{font-size:30px}.brand{font-size:19px}}
/* V6: phone, tablet, projector */
html{-webkit-text-size-adjust:100%;overflow-x:hidden}body{overflow-x:hidden} .shell,.card,.report,.event{min-width:0;overflow-wrap:anywhere}.line{align-items:flex-start}.line span{min-width:0;max-width:65%}.line b{text-align:right;min-width:0}button{touch-action:manipulation;min-height:45px}.report .line{line-height:1.55}.explain{padding:17px;border-radius:15px;background:#183047;border:1px solid #4d7897;margin:13px 0}.step{border-left:3px solid var(--gold);padding:9px 0 9px 13px;margin:9px 0}.delta-positive{color:#73e6ad}.delta-negative{color:#ff8878}.delta-neutral{color:#d8e3f2}
@media(max-width:640px){body{font-size:15px}.shell{padding:12px 10px 35px}.card{padding:15px;border-radius:16px}.hero{padding:20px 0 10px}h1{font-size:clamp(28px,9vw,44px)}h2{font-size:clamp(20px,6vw,27px)}.brand{font-size:18px}.grid,.team-picker{grid-template-columns:1fr}.top{align-items:flex-start}.money{font-size:28px}.code{font-size:27px;letter-spacing:.09em}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.metric strong{font-size:16px}.pill{font-size:11px}.event,.report,.explain{padding:13px}.toolbar>button{width:100%}.choice{padding:14px;font-size:15px}.line{font-size:13px;gap:8px}.line span{max-width:57%}.line b{max-width:43%}}
@media(max-width:350px){.metrics{grid-template-columns:1fr}.shell{padding:8px}.team-picker{grid-template-columns:1fr}}
</style></head><body><main class="shell" id="app"></main><script src="/socket.io/socket.io.js"></script><script>const socket=io();const app=document.getElementById('app');let state=null;const money=n=>Math.round(n).toLocaleString('vi-VN')+' ₫';const mil=n=>(n/1e6).toLocaleString('vi-VN',{maximumFractionDigits:2})+' triệu';const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const teamName=t=>'QUÁN PHỞ '+t;function toast(msg){const a=document.createElement('div');a.className='toast';a.textContent=msg;document.body.append(a);setTimeout(()=>a.remove(),4500)}function getTeam(t){return state?.teams?.find(x=>x.id===t)}function metricCard(t){let f=t.finance;return `<div class="card team${t.id}"><div class="subheader"><h2 class="${t.id==='A'?'blue':'red'}">🍜 QUÁN ${t.id}</h2><span class="pill">👥 ${t.players} người · 🗳️ ${t.votes} phiếu</span></div><div class="money ${f.cash>=0?'green':'red'}">${mil(f.cash)}</div><div class="muted tiny">Lợi nhuận tích lũy</div><div class="metrics"><div class="metric">Khách đã phục vụ<strong>${f.customers.toLocaleString('vi-VN')}</strong></div><div class="metric">Giá / bát<strong>${money(f.price)}</strong></div><div class="metric">Chi phí / bát<strong>${money(f.unitCost)}</strong></div><div class="metric">Hài lòng<strong>${f.satisfaction}%</strong><div class="progress"><div style="width:${f.satisfaction}%"></div></div></div></div></div>`}function delta(n,unit=''){return `<b class="${n>0?'delta-positive':n<0?'delta-negative':'delta-neutral'}">${n>0?'+':''}${n.toLocaleString('vi-VN')}${unit}</b>`}
function explanatoryCard(d){if(!d?.before)return '';const b=d.before,a=d.after,x=d.decisionEffects,t=d.twist;return `<section class="explain"><h3>🔎 GIẢI THÍCH QUYẾT ĐỊNH → BIẾN CỐ → HẬU QUẢ</h3>
<div class="step"><b>1. Đội đã quyết định gì?</b><p>${e(d.decision)}</p><small>Thay đổi trực tiếp của quyết định: khách dự kiến ${delta(x.demand)}; chi phí một lần ${delta(x.cash,' ₫')}; giá bán ${delta(x.price,' ₫/bát')}; giá vốn ${delta(x.unitCost,' ₫/bát')}; công suất ${delta(x.capacity,' bát')}.</small></div>
<div class="step"><b>2. Chuyện gì bất ngờ xảy ra, vì sao liên quan?</b><p><strong>${e(t.headline)}.</strong> ${e(t.description)}</p><p>${e(d.reasoning.cause)}</p></div>
<div class="step"><b>3. Biến cố gây tác động trực tiếp nào?</b><div class="line"><span>Nhu cầu khách do biến cố</span>${delta(t.demand,' lượt')}</div><div class="line"><span>Uy tín do biến cố</span>${delta(t.reputation,' điểm')}</div><div class="line"><span>Hài lòng do biến cố</span>${delta(t.satisfaction,' điểm')}</div><div class="line"><span>Thu/chi bất thường từ biến cố</span>${delta(t.cash,' ₫')}</div></div>
<div class="step"><b>4. Sau khi cộng tác động của quyết định và biến cố:</b><div class="line"><span>Uy tín: ${b.reputation} → ${a.reputation}</span>${delta(a.reputation-b.reputation,' điểm')}</div><div class="line"><span>Hài lòng: ${b.satisfaction} → ${a.satisfaction}</span>${delta(a.satisfaction-b.satisfaction,' điểm')}</div><div class="line"><span>Giá bán: ${money(b.price)} → ${money(a.price)}</span>${delta(a.price-b.price)}</div><div class="line"><span>Chi phí/bát: ${money(b.unitCost)} → ${money(a.unitCost)}</span>${delta(a.unitCost-b.unitCost)}</div><div class="line"><span>Khách tiềm năng / bán được</span><b>${d.potential.toLocaleString('vi-VN')} / ${d.sold.toLocaleString('vi-VN')} bát</b></div><p class="tiny muted">Khách tiềm năng = 3.000 + tác động quyết định + tác động biến cố + điều chỉnh từ uy tín, hài lòng và giá bán. Số bán không vượt công suất bếp. Những hệ số này là giả định dùng trong game.</p></div>
<div class="step"><b>5. Tiền lãi được tính ra sao?</b><div class="line"><span>Doanh thu = giá × bát bán</span><b>${money(d.revenue)}</b></div><div class="line"><span>Chi phí biến đổi = giá vốn × bát</span><b>−${money(d.variableCost)}</b></div><div class="line"><span>Chi phí cố định</span><b>−${money(d.fixedCost)}</b></div><div class="line"><span>Cộng / trừ thu chi phát sinh</span>${delta(d.oneoff,' ₫')}</div><div class="line"><span><b>Lãi/lỗ vòng này</b></span><b>${money(d.profit)}</b></div></div>
<div class="step"><b>6. Ảnh hưởng sang vòng sau</b><p>${e(d.reasoning.future)}</p><b>📚 Kiến thức liên hệ:</b><p>${e(d.note)}</p></div></section>`}function resultCard(t){const d=state.last[t];if(!d)return '';const type=d.twist.kind;return `<div class="card team${t}"><div class="subheader"><h2 class="${t==='A'?'blue':'red'}">QUÁN ${t}</h2><div class="money ${d.profit>=0?'green':'red'}">${d.profit>=0?'+':''}${mil(d.profit)}</div></div><p class="tiny">Lãi/lỗ riêng vòng · ${e(d.scenarioTitle)}</p><div class="report"><b>🗳️ Đội quyết định phương án ${d.choice+1}</b><p>${e(d.decision)}</p><div class="tiny muted">Số phiếu: ${d.tally.join(' / ')} ${d.defaulted?'· Chưa có phiếu, hệ thống chọn mặc định':''}</div></div><div class="event" style="border-color:${type==='up'?'#55b68b':type==='down'?'#bc6570':'#907244'}"><b>🎲 ${e(d.twist.headline)}</b><p>${e(d.twist.description)}</p><div class="tiny">Ảnh hưởng riêng biến cố: ${d.twist.demand>=0?'+':''}${d.twist.demand} khách tiềm năng · ${d.twist.cash>=0?'+':''}${money(d.twist.cash)} · Uy tín ${d.twist.reputation>=0?'+':''}${d.twist.reputation} điểm · Hài lòng ${d.twist.satisfaction>=0?'+':''}${d.twist.satisfaction} điểm</div></div><div class="line"><span>Khách đã phục vụ</span><b>${d.sold.toLocaleString('vi-VN')} bát</b></div><div class="line"><span>Doanh thu</span><b>${money(d.revenue)}</b></div><div class="line"><span>Chi phí nguyên liệu & vận hành biến đổi</span><b>${money(d.variableCost)}</b></div><div class="line"><span>Chi phí cố định</span><b>${money(d.fixedCost)}</b></div><div class="line"><span>Thu/chi quyết định và biến cố</span><b>${money(d.oneoff)}</b></div><div class="line"><span>Lãi lũy kế</span><b>${money(d.cumulative)}</b></div><div class="report"><b>📚 Liên hệ bài học</b><p>${e(d.note)}</p></div>${explanatoryCard(d)}</div>`}function finale(){let a=getTeam('A').finance.cash,b=getTeam('B').finance.cash,w=a===b?'HAI QUÁN HÒA NHAU':'QUÁN PHỞ '+(a>b?'A':'B')+' CHIẾN THẮNG';return `<section class="winner"><div class="eyebrow">KẾT QUẢ CHUNG CUỘC</div><h1>🏆 ${w}</h1><p>Thắng bằng lợi nhuận tích lũy sau các quyết định kinh doanh</p><div class="grid"><div class="card teamA"><h2>Quán A</h2><div class="money">${mil(a)}</div></div><div class="card teamB"><h2>Quán B</h2><div class="money">${mil(b)}</div></div></div><p>Doanh nghiệp có lợi thế khi kiểm soát chi phí trên toàn chuỗi giá trị nhưng vẫn giữ giá trị cho khách hàng.</p></section>`}function header(label){return `<div class="top"><div class="brand">🍜 PHỞ <span>ĐẠI CHIẾN V6</span></div><span class="tag">${label}</span></div>`}function footer(){return `<div class="footer">Mô phỏng giáo dục dựa trên chuỗi giá trị của Michael Porter · Các con số, biến cố và xác suất là giả định · Mỗi vòng mô phỏng một tháng · Lợi nhuận = doanh thu − chi phí biến đổi − chi phí cố định + thu/chi phát sinh.</div>`}
let code='',name='',team='',id='',voted=false,lastRound=-1;const params=new URLSearchParams(location.search);const prefill=(params.get('room')||'').toUpperCase();const storageKey='pho_guest_v4';let saved=null;try{saved=JSON.parse(sessionStorage.getItem(storageKey)||'null')}catch{}function join(){const c=(document.getElementById('code').value||'').trim().toUpperCase(),n=(document.getElementById('name').value||'').trim(),t=document.querySelector('input[name=team]:checked')?.value;if(!c||!n||!t)return toast('Nhập tên, mã phòng và chọn phe');socket.emit('player:join',{code:c,name:n,team:t,playerId:id||undefined},r=>{if(!r?.ok)return toast(r.error||'Không vào được phòng');code=c;name=n;team=t;id=r.playerId;sessionStorage.setItem(storageKey,JSON.stringify({code,name,team,id}));render()})}function rejoin(){if(!saved)return;socket.emit('player:join',saved,r=>{if(r?.ok){({code,name,team,id}=saved);render()}else{saved=null;sessionStorage.removeItem(storageKey);render()}})}function vote(i){if(voted)return;socket.emit('player:vote',{choice:i},r=>{if(!r?.ok)return toast(r.error||'Không gửi được phiếu');voted=true;render()})}function render(){if(!code){app.innerHTML=header('NGƯỜI CHƠI')+`<div class="hero center"><div class="eyebrow">CHỌN PHE · GIÀNH THỊ PHẦN · CHIẾN THẮNG</div><h1>🍜 PHỞ <span class="gold">ĐẠI CHIẾN</span></h1><p>Vào phòng, chọn quán và đưa ra quyết định kinh doanh của bạn!</p></div><div class="card" style="max-width:540px;margin:0 auto"><h2>Tham gia trận đấu</h2><label class="field" for="code">Mã phòng 6 ký tự</label><input class="input" id="code" maxlength="6" placeholder="VD: A1B2C3" value="${e(prefill)}"><label class="field" for="name">Tên của bạn</label><input class="input" id="name" maxlength="22" placeholder="Nhập tên người chơi"><label class="field">Chọn quán bạn muốn điều hành</label><div class="team-picker"><label>🔵 <input type="radio" name="team" value="A"> QUÁN A</label><label>🔴 <input type="radio" name="team" value="B"> QUÁN B</label></div><button onclick="join()" style="width:100%;margin-top:16px">THAM GIA NGAY →</button></div>`+footer();return}if(!state){app.innerHTML=header('KẾT NỐI')+'<div class="empty">Đang vào phòng…</div>';return}let st=state.status,t=getTeam(team);let html=header('NGƯỜI CHƠI')+(state.version==='6.3'?'':'<div class="notice danger">⚠️ Máy chủ chưa cập nhật V6.3.</div>')+`<div class="center" style="margin:20px 0"><span class="tag">PHÒNG ${e(code)} · ${e(name)}</span><h1 style="font-size:38px" class="${team==='A'?'blue':'red'}">🍜 QUÁN PHỞ ${team}</h1><p>🔵 Quán A: <b>${getTeam('A').players}</b> người · 🔴 Quán B: <b>${getTeam('B').players}</b> người</p></div>`;
if(st==='lobby')html+=`<div class="card center"><h2>✅ Bạn đã vào phe ${team}</h2><p>Chờ người điều hành mở vòng 1. Mỗi người có một phiếu duy nhất trong mỗi vòng.</p></div>`;
if(st==='voting'){let sc=state.scenario.teams[team];html+=`<div class="event"><div class="subheader"><span class="tag">VÒNG ${state.round+1}/${state.totalRounds}</span><span class="timer" id="clock">⏱ ${state.timeLeft}s</span></div><h2 style="margin-top:13px">${e(sc.title)}</h2><p>${e(sc.story)}</p><h3>${e(sc.question)}</h3></div><div class="choices">${sc.options.map((o,i)=>`<button class="choice" ${voted?'disabled':''} onclick="vote(${i})">${String.fromCharCode(65+i)}. ${e(o.text)}</button>`).join('')}</div><div style="margin-top:16px" class="${voted?'notice':'muted'}">${voted?'✅ Đã ghi nhận phiếu. Đang chờ kết quả của phe.':'Chọn một phương án. Bạn không thể sửa sau khi bỏ phiếu.'}</div><p class="center">🗳️ Phe ${team}: ${t.votes}/${t.players} người đã bỏ phiếu</p>`}
if(st==='results'){let d=state.last[team];html+=`<div class="center"><div class="eyebrow">QUYẾT ĐỊNH ĐÃ ĐƯỢC THỰC HIỆN</div><h1 class="${d.profit>=0?'green':'red'}">${d.profit>=0?'+':''}${mil(d.profit)}</h1><p>Lãi / lỗ vòng ${state.round+1}</p></div><div class="card"><h3>🗳️ Phe bạn chọn</h3><p>${e(d.decision)}</p><div class="muted tiny">Phiếu: ${d.tally.join(' / ')}</div><div class="event"><b>🎲 ${e(d.twist.headline)}</b><p>${e(d.twist.description)}</p></div><div class="line"><span>Uy tín sau biến cố</span><b>${d.reputation}%</b></div><div class="line"><span>Hài lòng sau biến cố</span><b>${d.satisfaction}%</b></div><div class="line"><span>Khách phục vụ</span><b>${d.sold} bát</b></div><div class="line"><span>Doanh thu</span><b>${money(d.revenue)}</b></div><div class="line"><span>Chi phí tổng cộng (trừ khoản khác)</span><b>${money(d.variableCost+d.fixedCost)}</b></div><div class="line"><span>Lợi nhuận tích lũy</span><b>${money(d.cumulative)}</b></div><div class="report"><b>📚 Bài học</b><p>${e(d.note)}</p></div>${explanatoryCard(d)}</div><p class="center">Đợi người điều hành mở vòng tiếp theo.</p>`}
if(st==='finished')html+=finale();
app.innerHTML=html+footer()}
socket.on('state',s=>{if(!code||s.code!==code)return;if(state&&s.round!==state.round)voted=false;if(state?.status==='lobby'&&s.status==='voting')voted=false;if(state?.status==='results'&&s.status==='voting')voted=false;state=s;render()});socket.on('game:error',message=>toast(message));socket.on('connect',()=>{if(code)socket.emit('player:join',{code,name,team,playerId:id},r=>{if(!r?.ok)toast(r.error)});else rejoin()});setInterval(()=>{if(state?.status==='voting'&&state.deadline){let el=document.getElementById('clock');if(el)el.textContent='⏱ '+Math.max(0,Math.ceil((state.deadline-Date.now())/1000))+'s'}},500);render();</script></body></html>
